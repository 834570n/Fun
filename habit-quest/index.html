<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <h1 class="brand"><span class="brand-icon" id="brand-icon"></span>Habit Quest</h1>
    <div class="topbar-actions">
      <button class="btn icon" id="btn-sound" type="button" data-act="sound" aria-pressed="true" aria-label="Sound effects">
        <span id="sound-glyph"></span>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="hero-col" aria-label="Your hero">
      <section class="win hero-card" id="hero-card"></section>
    </aside>

    <section class="content-col" aria-label="Quest log">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" id="tab-quests" data-act="tab" data-tab="quests" aria-controls="panel" aria-selected="true">Quests</button>
        <button class="tab" role="tab" id="tab-stats" data-act="tab" data-tab="stats" aria-controls="panel" aria-selected="false">Stats</button>
        <button class="tab" role="tab" id="tab-badges" data-act="tab" data-tab="badges" aria-controls="panel" aria-selected="false">Badges</button>
        <button class="tab" role="tab" id="tab-setup" data-act="tab" data-tab="setup" aria-controls="panel" aria-selected="false">Setup</button>
      </nav>
      <div class="win panel" id="panel" role="tabpanel" aria-labelledby="tab-quests"></div>
    </section>
  </main>
</div>

<dialog class="win" id="quest-dialog" aria-labelledby="q-heading">
  <form class="q-form" id="quest-form" novalidate>
    <h2 id="q-heading">New quest</h2>

    <div class="stack">
      <label class="lbl" for="q-name">Quest name</label>
      <input class="field" id="q-name" name="name" maxlength="60" autocomplete="off" placeholder="Stretch for 10 minutes" required>
    </div>

    <fieldset>
      <legend>Icon</legend>
      <div class="opt-grid" id="q-icons"></div>
    </fieldset>

    <fieldset>
      <legend>Attribute it trains</legend>
      <div class="opt-grid" id="q-stats"></div>
    </fieldset>

    <fieldset>
      <legend>Difficulty</legend>
      <div class="opt-grid" id="q-diffs"></div>
    </fieldset>

    <fieldset>
      <legend>Goal</legend>
      <div class="goal-row">
        <label class="opt"><input type="radio" name="goal" id="q-goal-once" value="once" checked><span>Once a day</span></label>
        <label class="opt"><input type="radio" name="goal" id="q-goal-count" value="count"><span>Count up to</span></label>
        <span class="goal-row" id="q-count-fields" hidden>
          <label class="sr-only" for="q-target">Daily target</label>
          <input class="field" id="q-target" name="target" type="number" min="2" max="99" value="8" inputmode="numeric">
          <label class="sr-only" for="q-unit">Unit</label>
          <input class="field unit" id="q-unit" name="unit" maxlength="12" placeholder="glasses" autocomplete="off">
        </span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Due on</legend>
      <div class="opt-grid" id="q-days"></div>
      <div class="row" style="margin-top:6px">
        <button class="btn small ghost" type="button" data-act="days-all">Every day</button>
        <button class="btn small ghost" type="button" data-act="days-weekdays">Weekdays</button>
        <button class="btn small ghost" type="button" data-act="days-weekends">Weekends</button>
      </div>
    </fieldset>

    <p class="form-error" id="q-error" role="alert" hidden></p>

    <div class="dlg-actions">
      <button class="btn danger small" type="button" id="q-retire" data-act="retire-from-dialog" hidden>Retire quest</button>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" data-act="dialog-cancel">Cancel</button>
      <button class="btn primary" type="submit" id="q-submit">Add quest</button>
    </div>
  </form>
</dialog>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div id="levelup-root"></div>

<script src="js/core.js"></script>
<script src="js/sprites.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
