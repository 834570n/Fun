<title>Graphite Sudoku</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* Layout: one sheet of graph paper. The grid is the hero on the left; a slim instrument column (tools, pad, new game) sits right and stacks under it below 860px. */
:root {
  --paper: #e8edeb;
  --paper-grid: rgba(38, 73, 176, 0.07);
  --sheet: #f9fbfa;
  --ink: #17202d;
  --pen: #2547ad;
  --pen-wash: #dde6fa;
  --on-pen: #ffffff;
  --graphite: #66707b;
  --muted: #5a6470;
  --rule: #17202d;
  --hair: #c3ccc9;
  --line: #d0d8d5;
  --peer: #e6ecf3;
  --match: #c9d7f2;
  --select: #b2c5ee;
  --error: #bf3426;
  --error-wash: #f7ddd8;
  --good: #2c7a4c;
  --btn: #ffffff;
  --btn-hover: #eef3f9;
  --shadow: rgba(23, 32, 45, 0.28);

  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1319;
    --paper-grid: rgba(142, 174, 255, 0.05);
    --sheet: #161b24;
    --ink: #e4e8ef;
    --pen: #8cadff;
    --pen-wash: #1e2a48;
    --on-pen: #0c1220;
    --graphite: #8d97a5;
    --muted: #9aa3b0;
    --rule: #c9d1de;
    --hair: #2b323e;
    --line: #2b323e;
    --peer: #1c2330;
    --match: #273657;
    --select: #33497d;
    --error: #ff7d6f;
    --error-wash: #3b2023;
    --good: #6fcf97;
    --btn: #1a202a;
    --btn-hover: #222a37;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1319;
  --paper-grid: rgba(142, 174, 255, 0.05);
  --sheet: #161b24;
  --ink: #e4e8ef;
  --pen: #8cadff;
  --pen-wash: #1e2a48;
  --on-pen: #0c1220;
  --graphite: #8d97a5;
  --muted: #9aa3b0;
  --rule: #c9d1de;
  --hair: #2b323e;
  --line: #2b323e;
  --peer: #1c2330;
  --match: #273657;
  --select: #33497d;
  --error: #ff7d6f;
  --error-wash: #3b2023;
  --good: #6fcf97;
  --btn: #1a202a;
  --btn-hover: #222a37;
  --shadow: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 15px;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--paper-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, .board:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }

.app {
  max-width: 940px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 48px;
  display: grid;
  gap: 22px;
}

/* Masthead */
.masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.masthead h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(28px, 5vw, 38px);
  line-height: 1;
  letter-spacing: -0.01em;
}
.meta {
  margin: 8px 0 0;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.clock { display: flex; align-items: center; gap: 10px; }
.timer {
  font-family: var(--font-mono);
  font-size: 26px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--btn);
  cursor: pointer;
}
.icon-btn:hover { background: var(--btn-hover); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i .dot { fill: currentColor; stroke: none; }

/* Table: board column + instruments */
.table {
  display: grid;
  grid-template-columns: minmax(0, 560px) minmax(260px, 300px);
  gap: 36px;
  align-items: start;
  justify-content: center;
}
.board-col { display: grid; gap: 14px; min-width: 0; }
.board-wrap { position: relative; width: 100%; container-type: inline-size; }
@media (min-width: 861px) {
  .board-wrap { width: min(100%, calc(100dvh - 170px)); min-width: 380px; }
}

/* The grid: thick rules come from the 3px gap between boxes, hairlines from the 1px gap between cells. */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px;
  padding: 3px;
  aspect-ratio: 1;
  max-width: 100%;
  background: var(--rule);
  border-radius: 5px;
  box-shadow: 0 22px 44px -30px var(--shadow);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.box {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 1px;
  background: var(--hair);
}
.cell {
  position: relative;
  display: grid;
  place-items: center;
  background: var(--sheet);
  cursor: pointer;
  overflow: hidden;
  min-width: 0;
}
.box:nth-child(1) .cell:nth-child(1) { border-top-left-radius: 2px; }
.val {
  line-height: 1;
  font-size: clamp(18px, 5.6vw, 34px);
  font-size: 6.4cqw;
}
.cell.given .val { font-family: var(--font-display); color: var(--ink); }
.cell.entry .val { font-family: var(--font-ui); font-weight: 500; color: var(--pen); }
.notes {
  position: absolute;
  inset: 5%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  place-items: center;
  font-family: var(--font-mono);
  font-size: clamp(8px, 2.2vw, 13px);
  font-size: 2.45cqw;
  line-height: 1;
  color: var(--graphite);
  pointer-events: none;
}
.notes i { font-style: normal; display: grid; place-items: center; width: 100%; height: 100%; border-radius: 3px; }
.notes i.hit { color: var(--pen); font-weight: 500; background: var(--match); }

.cell.peer { background: var(--peer); }
.cell.match { background: var(--match); }
.cell.sel { background: var(--select); }
.cell.sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--pen); pointer-events: none; }
.cell.conflict .val { color: var(--error); }
.cell.wrong { background: var(--error-wash); }
.cell.wrong .val { color: var(--error); }
.cell.wrong::before {
  content: "";
  position: absolute;
  left: 24%; right: 24%; top: 50%;
  height: 2px;
  background: var(--error);
  transform: rotate(-38deg);
  border-radius: 2px;
  pointer-events: none;
}

@keyframes ink-in { from { transform: scale(1.6); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
.cell.hinted .val { animation: ink-in 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes wave { 0% { background: var(--sheet); } 35% { background: var(--match); } 100% { background: var(--sheet); } }
.board.solved .cell { animation: wave 0.9s ease-out calc(var(--d) * 45ms) both; }
.board.hidden-digits .val, .board.hidden-digits .notes { visibility: hidden; }

/* Overlay for drafting, paused and solved states */
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--paper) 72%, transparent);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}
.card {
  width: min(100%, 340px);
  display: grid;
  gap: 10px;
  justify-items: start;
  padding: 24px 26px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--sheet);
  box-shadow: 0 24px 50px -28px var(--shadow);
}
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.big-time { font-family: var(--font-mono); font-size: 40px; font-variant-numeric: tabular-nums; color: var(--pen); line-height: 1; }
.card .line { color: var(--muted); font-size: 14px; }
.card .needs { font-size: 14px; line-height: 1.5; color: var(--ink); max-width: 34ch; }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.dots i { font-style: normal; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

.keys {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
}
.keys kbd {
  font-family: inherit;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--btn);
  color: var(--ink);
}
@media (hover: none) { .keys { display: none; } }

/* Instruments */
.instruments { display: grid; gap: 18px; min-width: 0; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 10px 4px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--btn);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}
.tool:hover:not(:disabled) { background: var(--btn-hover); }
.tool:disabled { opacity: 0.4; cursor: default; }
.tool .state { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tool[aria-pressed="true"] { background: var(--pen-wash); border-color: var(--pen); color: var(--pen); }
.tool[aria-pressed="true"] .state { color: var(--pen); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  position: relative;
  aspect-ratio: 1.3;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--btn);
  cursor: pointer;
  transition: transform 0.08s ease;
}
.key:hover { background: var(--btn-hover); }
.key:active { transform: translateY(1px); }
.key .kd { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.key small {
  position: absolute;
  right: 8px; bottom: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.key.done .kd { opacity: 0.3; }
.notes-on .key { border-style: dashed; border-color: var(--graphite); }
.notes-on .key .kd { font-family: var(--font-mono); font-size: 22px; color: var(--graphite); }

.status {
  margin: 0;
  min-height: 4.5em;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
}
.status[data-tone="warn"] { color: var(--error); }
.status[data-tone="good"] { color: var(--good); }

.new-game { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--btn); }
.seg button { border: 0; background: transparent; padding: 7px 0; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--sheet); }
.seg-note { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.primary, .ghost {
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid transparent;
}
.primary { background: var(--pen); color: var(--on-pen); flex: 1 1 auto; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: var(--btn); border-color: var(--line); }
.ghost:hover { background: var(--btn-hover); }
.armed { background: var(--error-wash) !important; color: var(--error) !important; border-color: var(--error) !important; }

@media (max-width: 860px) {
  .table { grid-template-columns: minmax(0, 560px); gap: 18px; }
  .instruments { gap: 14px; }
  .tools { grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .tool { font-size: 11px; padding: 8px 2px 6px; }
  .tool .state { display: none; }
  .pad { grid-template-columns: repeat(9, 1fr); gap: 5px; }
  .key { aspect-ratio: 0.78; border-radius: 8px; }
  .key .kd { font-size: 24px; }
  .notes-on .key .kd { font-size: 18px; }
  .key small { right: 0; left: 0; bottom: 4px; text-align: center; font-size: 9.5px; }
  .status { min-height: 3em; }
}
@media (max-width: 380px) {
  .tool span.t { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<div class="app">
  <header class="masthead">
    <div>
      <h1>Graphite Sudoku</h1>
      <p class="meta" id="meta">Hard · 28 givens</p>
    </div>
    <div class="clock">
      <span class="timer" id="timer" aria-label="Elapsed time">00:00</span>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
  </header>

  <main class="table">
    <section class="board-col">
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Sudoku grid" tabindex="0"></div>
        <div class="overlay" id="overlay" hidden></div>
      </div>
      <p class="keys" aria-label="Keyboard shortcuts">
        <span><kbd>1</kbd>–<kbd>9</kbd> write</span>
        <span><kbd>Shift</kbd>+digit note</span>
        <span><kbd>N</kbd> notes mode</span>
        <span><kbd>Del</kbd> erase</span>
        <span><kbd>←↑→↓</kbd> move</span>
        <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
        <span><kbd>P</kbd> pause</span>
      </p>
    </section>

    <aside class="instruments">
      <div class="tools">
        <button class="tool" id="undoBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span class="t">Undo</span>
        </button>
        <button class="tool" id="eraseBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span class="t">Erase</span>
        </button>
        <button class="tool" id="notesBtn" type="button" aria-pressed="false">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.9L2 22l4.9-1.3a2 2 0 0 0 .9-.5z"/><path d="m15 5 4 4"/></svg>
          <span class="t">Notes</span>
          <span class="state" id="notesState">Off</span>
        </button>
        <button class="tool" id="fillBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle class="dot" cx="8" cy="8" r="1.1"/><circle class="dot" cx="12" cy="8" r="1.1"/><circle class="dot" cx="16" cy="8" r="1.1"/><circle class="dot" cx="8" cy="12" r="1.1"/><circle class="dot" cx="16" cy="12" r="1.1"/><circle class="dot" cx="12" cy="16" r="1.1"/><circle class="dot" cx="16" cy="16" r="1.1"/></svg>
          <span class="t">Fill notes</span>
        </button>
        <button class="tool" id="hintBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
          <span class="t">Hint</span>
        </button>
        <button class="tool" id="checkBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span class="t">Check</span>
        </button>
      </div>

      <div class="pad" id="pad" aria-label="Number pad"></div>

      <p class="status" id="status" aria-live="polite"></p>

      <div class="new-game">
        <p class="label" id="diffLabel">Next puzzle</p>
        <div class="seg" role="radiogroup" aria-labelledby="diffLabel">
          <button type="button" role="radio" data-diff="easy" aria-checked="false">Easy</button>
          <button type="button" role="radio" data-diff="medium" aria-checked="false">Medium</button>
          <button type="button" role="radio" data-diff="hard" aria-checked="true">Hard</button>
          <button type="button" role="radio" data-diff="expert" aria-checked="false">Expert</button>
        </div>
        <p class="seg-note" id="segNote">Needs naked or hidden pairs and triples.</p>
        <div class="row">
          <button class="primary" id="newBtn" type="button">New Hard puzzle</button>
          <button class="ghost" id="restartBtn" type="button">Restart</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
// Puzzle engine: generation, uniqueness search, and a human-style grader.
const Engine = (() => {
  const POP = new Uint8Array(512);
  for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);
  const DIGIT_OF = new Uint8Array(512);
  for (let d = 1; d <= 9; d++) DIGIT_OF[1 << (d - 1)] = d;
  const bit = d => 1 << (d - 1);
  const digitsOf = m => { const out = []; for (let d = 1; d <= 9; d++) if (m & bit(d)) out.push(d); return out; };

  const rowOf = i => (i / 9) | 0;
  const colOf = i => i % 9;
  const boxOf = i => ((rowOf(i) / 3) | 0) * 3 + ((colOf(i) / 3) | 0);
  const R = new Uint8Array(81), C = new Uint8Array(81), X = new Uint8Array(81);
  for (let i = 0; i < 81; i++) { R[i] = rowOf(i); C[i] = colOf(i); X[i] = boxOf(i); }

  // Units 0-8 are rows, 9-17 columns, 18-26 boxes.
  const UNITS = [];
  for (let r = 0; r < 9; r++) UNITS.push(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) UNITS.push(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let b = 0; b < 9; b++) {
    const r0 = ((b / 3) | 0) * 3, c0 = (b % 3) * 3;
    UNITS.push(Array.from({ length: 9 }, (_, k) => (r0 + ((k / 3) | 0)) * 9 + c0 + (k % 3)));
  }
  const unitName = u => u < 9 ? `row ${u + 1}` : u < 18 ? `column ${u - 8}` : `box ${u - 17}`;
  const PEERS = Array.from({ length: 81 }, (_, i) => {
    const s = new Set([...UNITS[R[i]], ...UNITS[9 + C[i]], ...UNITS[18 + X[i]]]);
    s.delete(i);
    return [...s];
  });
  const isPeer = (a, b) => a !== b && (R[a] === R[b] || C[a] === C[b] || X[a] === X[b]);
  const cellName = i => `R${R[i] + 1}C${C[i] + 1}`;

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function combos(arr, k, start = 0, acc = [], out = []) {
    if (acc.length === k) { out.push(acc.slice()); return out; }
    for (let i = start; i <= arr.length - (k - acc.length); i++) {

  function undo() {
    if (!canPlay()) return;
    const entry = S.undo.pop();
    if (!entry) { say('Nothing to undo.'); return; }
    for (const [i, v, n] of entry) S.values[i] = v, S.notes[i] = n;
    S.wrong = S.wrong.filter(i => !entry.some(([j]) => j === i));
    S.selected = entry[0][0];
    commit();
  }

  function toggleNotes() {
    if (!S || S.completed || busy) return;
    S.notesMode = !S.notesMode;
    commit();
    say(S.notesMode ? 'Notes mode on. Numbers go in as pencil marks.' : 'Notes mode off. Numbers go in as answers.');
  }

  function fillNotes() {
    if (!canPlay()) return;
    const grid = currentGrid(), empties = [];
    for (let i = 0; i < 81; i++) if (!grid[i]) empties.push(i);
    if (!empties.length) return;
    record(empties);
    for (const i of empties) {
      let m = 511;
      for (const p of E.PEERS[i]) if (grid[p]) m &= ~E.bit(grid[p]);
      S.notes[i] = m;
    }
    commit();
    say(`Pencilled every candidate into ${empties.length} empty squares. Undo takes them back out.`);
  }

  function check() {
    if (!canPlay()) return;
    const wrong = [];
    let filled = 0;
    for (let i = 0; i < 81; i++) {
      if (S.puzzle[i] || !S.values[i]) continue;
      filled++;
      if (S.values[i] !== S.solution[i]) wrong.push(i);
    }
    S.checks++;
    S.wrong = wrong;
    commit();
    if (!filled) say('Nothing to check yet. Write a few answers first.');
    else if (!wrong.length) say(`All ${filled} of your answers are correct so far.`, 'good');
    else say(`${wrong.length} of your ${filled} answers ${wrong.length === 1 ? "doesn't" : "don't"} match the solution. ${wrong.length === 1 ? "It's" : "They're"} struck through in red.`, 'warn');
  }

  function hint() {
    if (!canPlay()) return;
    const wrong = [];
    for (let i = 0; i < 81; i++) if (!S.puzzle[i] && S.values[i] && S.values[i] !== S.solution[i]) wrong.push(i);
    if (wrong.length) {
      S.wrong = [...new Set([...S.wrong, ...wrong])];
      S.selected = wrong[0];
      S.hints++;
      commit();
      const more = wrong.length > 1 ? `, and ${wrong.length - 1} other answer${wrong.length > 2 ? 's are' : ' is'} too` : '';
      say(`Hint: fix this first. The ${S.values[wrong[0]]} in ${E.cellName(wrong[0])} is wrong${more}.`, 'warn');
      return;
    }
    const grid = currentGrid();
    if (grid.every(Boolean)) return;
    const h = E.nextHint(grid);
    let i, d, text;
    if (h && S.solution[h.cell] === h.digit) {
      i = h.cell;
      d = h.digit;
      const reason = h.name === 'hidden single'
        ? `${d} has only one place left in ${E.unitName(h.unit)}`
        : `${d} is the only candidate left there`;
      const after = h.path.length ? `, once you apply ${listJoin(h.path)} eliminations` : '';
      text = `${capitalize(h.name)} at ${E.cellName(i)}. ${reason}${after}.`;
    } else {
      i = S.selected != null && !grid[S.selected] ? S.selected : grid.findIndex(v => !v);
      d = S.solution[i];
      text = `No technique in the grader's toolkit finds the next step, so this reveals ${E.cellName(i)}.`;
    }
    S.selected = i;
    S.hints++;
    place(i, d);
    flash(i);
    if (!S.completed) say(`Hint: ${text}`);
  }

  function checkFinished() {
    for (let i = 0; i < 81; i++) if (!valueAt(i)) return;
    for (let i = 0; i < 81; i++) {
      if (valueAt(i) !== S.solution[i]) {
        say('Every square is filled, but some answers are wrong. Check strikes them through in red.', 'warn');
        return;
      }
    }
    finish();
  }

  function finish() {
    stopClock();
    S.completed = true;
    S.selected = null;
    const t = S.elapsed, prev = bests[S.difficulty];
    const newBest = S.hints === 0 && (!prev || t < prev);
    if (newBest) { bests[S.difficulty] = t; saveBests(); }
    S.result = { time: t, newBest };
    commit();
    boardEl.classList.remove('solved');
    void boardEl.offsetWidth;
    boardEl.classList.add('solved');
    say(`Solved in ${fmt(t)}.`, 'good');
    setTimeout(showSolved, reduceMotion ? 0 : 1300);
  }

  function techniqueLine() {
    const names = TECHNIQUE_ORDER.filter(n => S.used.includes(n)).map(plural);
    let line = names.length ? `The grader needed ${listJoin(names)} to crack this one.` : '';
    if (S.level === 5) line += ' It also needed a step beyond X-Wings and XY-Wings.';
    return line;
  }

  function showSolved() {
    if (!S || !S.completed) return;
    const r = S.result || { time: S.elapsed, newBest: false };
    const best = bests[S.difficulty];
    const hints = S.hints ? `${S.hints} hint${S.hints > 1 ? 's' : ''}` : 'No hints';
    const bestLine = best ? ` · Best ${LABEL[S.difficulty]} ${fmt(best)}${r.newBest ? ', a new record' : ''}` : '';
    showOverlay('solved', `
      <div class="card" role="dialog" aria-label="Puzzle solved">
        <p class="eyebrow">${LABEL[S.difficulty]} · ${S.clues} givens</p>
        <h2>Solved</h2>
        <p class="big-time">${fmt(r.time)}</p>
        <p class="line">${hints}${bestLine}</p>
        <p class="needs">${techniqueLine()}</p>
        <div class="actions">
          <button class="primary" id="nextBtn" type="button">Next ${LABEL[pendingDifficulty]} puzzle</button>
          <button class="ghost" id="viewBtn" type="button">View grid</button>
        </div>
      </div>`);
    $('nextBtn').addEventListener('click', () => newGame(pendingDifficulty));
    $('viewBtn').addEventListener('click', () => { hideOverlay(); boardEl.classList.remove('solved'); });
    $('nextBtn').focus({ preventScroll: true });
  }

  // ---- Pause ----
  function setPauseIcon() {
    const btn = $('pauseBtn');
    btn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    btn.innerHTML = paused
      ? '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg>'
      : '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  }

  function pause(auto) {
    if (!S || S.completed || busy || paused) return;
    paused = true;
    stopClock();
    boardEl.classList.add('hidden-digits');
    showOverlay('paused', `
      <div class="card" role="dialog" aria-label="Paused">
        <p class="eyebrow">${auto ? 'Paused while you were away' : 'Paused'}</p>
        <h2>${fmt(S.elapsed)}</h2>
        <p class="line">The grid is hidden so the clock stays honest.</p>
        <div class="actions"><button class="primary" id="resumeBtn" type="button">Resume</button></div>
      </div>`);
    $('resumeBtn').addEventListener('click', resume);
    setPauseIcon();
    save();
  }

  function resume() {
    if (!paused) return;
    paused = false;
    hideOverlay();
    boardEl.classList.remove('hidden-digits');
    startClock();
    setPauseIcon();
    boardEl.focus({ preventScroll: true });
  }

  // ---- New game, restart ----
  function clearConfirm() {
    clearTimeout(confirmTimer);
    for (const b of [newBtn, restartBtn]) {
      if (!b.dataset.armed) continue;
      delete b.dataset.armed;
      b.textContent = b.dataset.label;
      b.classList.remove('armed');
    }
  }

  // First click arms the button and asks; a second click within a few seconds runs the action.
  function confirmThen(btn, question, action) {
    if (btn.dataset.armed) { clearConfirm(); action(); return; }
    clearConfirm();
    btn.dataset.armed = '1';
    btn.dataset.label = btn.textContent;
    btn.textContent = question;
    btn.classList.add('armed');
    confirmTimer = setTimeout(clearConfirm, 4000);
  }

  function newGame(diff) {
    if (busy) return;
    busy = true;
    paused = false;
    setPauseIcon();
    stopClock();
    clearConfirm();
    boardEl.classList.remove('solved', 'hidden-digits');
    showOverlay('drafting', `
      <div class="card" role="status">
        <p class="eyebrow">${LABEL[diff]}</p>
        <h2>Drafting a grid<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
        <p class="line" id="draftNote">${BAND_NOTE[diff]}</p>
      </div>`);
    let best = null, tries = 0;
    const done = c => {
      S = freshState(c);
      busy = false;
      hideOverlay();
      commit();
      startClock();
      say(`Fresh ${LABEL[diff]} grid with ${c.clues} givens, picked from ${tries} draft${tries > 1 ? 's' : ''}.`);
      boardEl.focus({ preventScroll: true });
    };
    const work = () => {
      const t0 = performance.now();
      while (performance.now() - t0 < 30) {
        const c = E.attempt(diff);
        tries++;
        if (E.accepts(diff, c)) return done(c);
        best = E.better(diff, best, c);
        if (tries >= 1500) return done(best);
      }
      const note = $('draftNote');
      if (note) note.textContent = `${tries} drafts graded so far.`;
      setTimeout(work, 0);
    };
    setTimeout(work, 80);
  }

  function restart() {
    const touched = [];
    for (let i = 0; i < 81; i++) if (S.values[i] || S.notes[i]) touched.push(i);
    if (S.completed) {
      const keep = { difficulty: S.difficulty, puzzle: S.puzzle, solution: S.solution, level: S.level, used: S.used, clues: S.clues };
      S = freshState(keep);
      hideOverlay();
      boardEl.classList.remove('solved');
      commit();
      startClock();
      say('Same grid, clean slate. The clock starts over.');
      return;
    }
    record(touched);
    for (const i of touched) S.values[i] = 0, S.notes[i] = 0;
    S.wrong = [];
    commit();
    say('Cleared your answers and notes. Undo brings them back.');
  }

  function updateDifficultyUI() {
    clearConfirm();
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.diff === pendingDifficulty)));
    $('segNote').textContent = BAND_NOTE[pendingDifficulty];
    newBtn.textContent = `New ${LABEL[pendingDifficulty]} puzzle`;
  }

  // ---- Wiring ----
  undoBtn.addEventListener('click', undo);
  $('eraseBtn').addEventListener('click', erase);
  notesBtn.addEventListener('click', toggleNotes);
  $('fillBtn').addEventListener('click', fillNotes);
  $('hintBtn').addEventListener('click', hint);
  $('checkBtn').addEventListener('click', check);
  $('pauseBtn').addEventListener('click', () => (paused ? resume() : pause(false)));
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    pendingDifficulty = b.dataset.diff;
    updateDifficultyUI();
  }));
  newBtn.addEventListener('click', () => {
    const go = () => newGame(pendingDifficulty);
    if (S && !S.completed && S.values.some(Boolean)) confirmThen(newBtn, 'Discard this grid?', go);
    else go();
  });
  restartBtn.addEventListener('click', () => {
    if (!S || busy) return;
    if (!S.completed && !S.values.some(Boolean) && !S.notes.some(Boolean)) { say('Nothing to clear yet.'); return; }
    confirmThen(restartBtn, S.completed ? 'Play it again?' : 'Clear all entries?', restart);
  });

  document.addEventListener('keydown', e => {
    if (!S) return;
    const k = e.key;
    if ((k === 'Enter' || k === ' ') && e.target.closest && e.target.closest('button')) return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
    const d = m ? +m[1] : /^[1-9]$/.test(k) ? +k : 0;
    if (d) { e.preventDefault(); enter(d, S.notesMode !== e.shiftKey); return; }
    const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (arrows[k]) { e.preventDefault(); if (!busy && !paused) move(...arrows[k]); return; }
    if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); erase(); return; }
    if (k === 'n' || k === 'N') { toggleNotes(); return; }
    if (k === 'p' || k === 'P') { paused ? resume() : pause(false); return; }
    if (k === 'Escape') {
      if (paused) resume();
      else if (S.selected != null) { S.selected = null; render(); }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pause(true);
  });

  // ---- Boot ----
  function boot(data) {
    const saved = (data && isGame(data.game) && data.game) || loadSaved();
    S = saved ? { ...freshState(saved), ...saved } : freshState(STARTER);
    pendingDifficulty = S.difficulty;
    updateDifficultyUI();
    commit();
    if (S.completed) {
      showSolved();
      say(`Solved in ${fmt(S.elapsed)}. Pick a difficulty for the next one.`, 'good');
    } else {
      startClock();
      say(saved
        ? 'Welcome back. Your grid is where you left it.'
        : 'A Hard grid is ready. Select a square, then a number. Turn on Notes to pencil in candidates.');
    }
  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ game: snapshot() }));
  if (hot && hot.ready) hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
